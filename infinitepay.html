<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Abrir InfinitePay</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      background: #f4f4f4;
    }

    .card {
      width: min(88%, 420px);
      padding: 25px;
      background: white;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
      text-align: center;
    }

    .botao {
      display: block;
      padding: 18px;
      margin-top: 20px;
      border-radius: 10px;
      background: #111;
      color: white;
      font-size: 18px;
      font-weight: bold;
      text-decoration: none;
    }

    #debug {
      margin-top: 20px;
      padding: 10px;
      font-size: 12px;
      text-align: left;
      overflow-wrap: anywhere;
      background: #eeeeee;
      border-radius: 8px;
    }
  </style>
</head>

<body>

  <div class="card">

    <h2>Pagamento InfinitePay</h2>

    <p id="resumo"></p>

    <a
      id="abrir"
      class="botao"
      href="#"
    >
      ABRIR INFINITEPAY
    </a>

    <div id="debug"></div>

  </div>

  <script>
    const parametros =
      new URLSearchParams(window.location.search);

    const amount =
      parametros.get("amount") || "100";

    const paymentMethod =
      parametros.get("payment_method") || "debit";

    const installments =
      parametros.get("installments") || "1";

    const orderId =
      parametros.get("order_id") || "TESTE123";

    /*
     * Neste primeiro teste, usamos uma URL HTTPS
     * apenas para garantir que result_url seja enviado.
     */
    const resultUrl =
      window.location.origin +
      window.location.pathname +
      "?retorno=1";

    let deeplink =
      "infinitepaydash://infinitetap-app" +
      "?amount=" +
      encodeURIComponent(amount) +
      "&payment_method=" +
      encodeURIComponent(paymentMethod);

    if (paymentMethod === "credit") {
      deeplink +=
        "&installments=" +
        encodeURIComponent(installments);
    }

    deeplink +=
      "&order_id=" +
      encodeURIComponent(orderId) +
      "&result_url=" +
      encodeURIComponent(resultUrl) +
      "&app_client_referrer=" +
      encodeURIComponent("AppSheetPDV");

    document
      .getElementById("abrir")
      .setAttribute("href", deeplink);

    const valorReais =
      (Number(amount) / 100)
        .toLocaleString(
          "pt-BR",
          {
            style: "currency",
            currency: "BRL"
          }
        );

    document
      .getElementById("resumo")
      .textContent =
        valorReais +
        " — " +
        (
          paymentMethod === "credit"
            ? "Crédito 1x"
            : "Débito"
        );

    document
      .getElementById("debug")
      .textContent =
        deeplink;
  </script>

</body>
</html>
