
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <title>Teste PBKDF2 - QuintosCoin</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #101827;
      color: white;
      padding: 25px;
      text-align: center;
    }

    button {
      padding: 16px 22px;
      border: 0;
      border-radius: 10px;
      background: #d6ac54;
      color: #111;
      font-weight: bold;
      font-size: 16px;
    }

    button:disabled {
      opacity: 0.5;
    }

    #resultado {
      margin-top: 25px;
      line-height: 1.8;
      white-space: pre-line;
    }
  </style>
</head>

<body>

  <h2>QuintosCoin</h2>
  <h3>Teste de velocidade PBKDF2</h3>

  <p>
    600.000 iterações HMAC-SHA256
  </p>

  <p>
    Este teste usa uma senha fictícia.
  </p>

  <button id="btnTeste" onclick="testar()">
    Iniciar teste
  </button>

  <div id="resultado">
    Aguardando teste...
  </div>

  
<script src="qc-criptografia.js?v=1"></script>

<script>
  async function testar() {

    const botao = document.getElementById("btnTeste");
    const saida = document.getElementById("resultado");

    botao.disabled = true;
    saida.textContent = "Testando criptografia V2...";

    try {

      const senhaFicticia = "Teste123";

      const salt1 = QC_gerarSaltSenhaV2();
      const salt2 = QC_gerarSaltSenhaV2();

      const inicio = performance.now();

      const resultado1 = await QC_derivarSenhaV2(
        senhaFicticia,
        salt1
      );

      const tempo = (
        (performance.now() - inicio) / 1000
      ).toFixed(2);

      const resultado2 = await QC_derivarSenhaV2(
        senhaFicticia,
        salt1
      );

      const resultado3 = await QC_derivarSenhaV2(
        senhaFicticia,
        salt2
      );

      const mesmoSalt =
        resultado1 === resultado2;

      const saltDiferente =
        resultado1 !== resultado3;

      const tamanhoCorreto =
        resultado1.length === 64;

      saida.textContent =
        "Tempo da primeira derivação: " +
        tempo + " segundo(s)\n\n" +

        "Mesmo salt e mesma senha: " +
        (mesmoSalt ? "OK" : "ERRO") + "\n" +

        "Salt diferente: " +
        (saltDiferente ? "OK" : "ERRO") + "\n" +

        "Resultado de 256 bits: " +
        (tamanhoCorreto ? "OK" : "ERRO");

    } catch (erro) {

      saida.textContent =
        "ERRO: " + erro.message;

    } finally {

      botao.disabled = false;

    }
  }
</script>


</body>
</html>
