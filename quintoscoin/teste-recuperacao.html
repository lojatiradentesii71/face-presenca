
<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <title>Teste de Recuperação QuintosCoin</title>

  <style>
    body {
      background: #101b30;
      color: white;
      font-family: Arial, sans-serif;
      padding: 25px;
      text-align: center;
    }

    h2 {
      color: #e9c46a;
    }

    .painel {
      max-width: 420px;
      margin: 40px auto;
      padding: 25px;
      background: #1b2c48;
      border-radius: 16px;
    }

    button {
      background: #e9c46a;
      color: #101b30;
      border: none;
      padding: 16px;
      width: 100%;
      border-radius: 10px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    #codigo {
      margin-top: 25px;
      padding: 15px;
      background: #101b30;
      border: 1px solid #e9c46a;
      border-radius: 10px;
      font-size: 17px;
      font-weight: bold;
      overflow-wrap: anywhere;
      user-select: all;
    }

    .aviso {
      margin-top: 20px;
      color: #ffcc80;
      font-size: 13px;
      line-height: 1.5;
    }
  </style>
</head>

<body>

  <div class="painel">

    <h2>QUINTOSCOIN</h2>

    <h3>Código de Recuperação</h3>

    <p>Teste de geração de código seguro.</p>

    <button onclick="gerarCodigo()">
      Gerar código de teste
    </button>

    <div id="codigo">
      Nenhum código gerado
    </div>

    <p class="aviso">
      ATENÇÃO: Este é apenas um teste.
      O código ainda não está vinculado
      a nenhuma carteira e não pode
      recuperar senhas.
    </p>

  </div>

  <script>

    function gerarCodigo() {

      // 16 bytes = 128 bits de aleatoriedade
      const bytes = new Uint8Array(16);

      window.crypto.getRandomValues(bytes);

      const hexadecimal = Array.from(bytes)
        .map(byte => byte.toString(16).padStart(2, "0"))
        .join("")
        .toUpperCase();

      const codigo = hexadecimal
        .match(/.{1,8}/g)
        .join("-");

      document.getElementById("codigo")
        .textContent = codigo;
    }

  </script>

</body>
</html>
