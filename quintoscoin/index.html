<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <title>QuintosCoin - Carteira</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="carteira">

    <header>
      <h1>QUINTOSCOIN</h1>
      <p>Carteira Digital</p>
    </header>

    <section class="saldo">
      <p>Saldo disponível</p>
      <h2 id="saldo">0 QC</h2>
      <small id="equivalente">R$ 0,00</small>
    </section>

    <section class="acoes">
      <button id="btnReceber">Receber QC</button>
      <button id="btnDoar">Doar QC</button>
    </section>

    <section class="fichas">
      <h3>Minhas fichas</h3>
      <div id="listaFichas">
        Nenhuma ficha disponível.
      </div>
    </section>

    <p id="mensagem"></p>

  </main>

  <script src="carteira.js"></script>

</body>
</html>
