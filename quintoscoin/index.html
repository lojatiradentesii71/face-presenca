<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <title>QuintosCoin - Carteira</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="carteira">

    <section id="telaAcesso">

  <header>
    <h1>QUINTOSCOIN</h1>
    <p>Acesso à Carteira Digital</p>
  </header>

  <div id="formAtivacao" class="painel-acesso">

    <h3>Primeiro acesso</h3>

    <p>Informe seu IdCadastro e crie sua senha.</p>

    <input
      type="text"
      id="qcIdCadastro"
      placeholder="IdCadastro"
      autocomplete="off"
    >

    <input
      type="password"
      id="qcNovaSenha"
      placeholder="Criar senha"
      autocomplete="new-password"
    >

    <input
      type="password"
      id="qcConfirmarSenha"
      placeholder="Confirmar senha"
      autocomplete="new-password"
    >

    <button id="btnAtivarCarteira">
      Ativar carteira
    </button>

    <p>
      <a href="#" id="linkJaTenhoCarteira">
        Já tenho uma carteira
      </a>
    </p>

  </div>

  <div id="formLogin" class="painel-acesso"
       style="display:none;">

    <h3>Entrar na carteira</h3>

    <p>Digite sua senha para continuar.</p>

    <input
      type="password"
      id="qcSenhaLogin"
      placeholder="Sua senha"
      autocomplete="current-password"
    >

    <button id="btnEntrarCarteira">
      Entrar
    </button>

    <p>
      <a href="#" id="linkPrimeiroAcesso">
        Primeiro acesso
      </a>
    </p>

  </div>

  <p id="qcMensagemAcesso"></p>

</section>

<section id="telaCarteira"
style="display:nome;">

    <header>
      <h1>QUINTOSCOIN</h1>
      <p>Carteira Digital</p>
    </header>

    <section class="saldo">
      <p>Saldo disponível</p>
      <h2 id="saldo">0 QC</h2>
      <small id="equivalente">R$ 0,00</small>
    </section>

    <section class="acoes">
      <button id="btnReceber">Receber QC</button>
      <button id="btnDoar">Doar QC</button>
    </section>

    <section class="fichas">
      <h3>Minhas fichas</h3>
      <div id="listaFichas">
        Nenhuma ficha disponível.
      </div>
    </section>

    <p id="mensagem"></p>

</section>

</main>


  <script
    src="carteira.js?v=10"
    onload="alert('TESTE JS: arquivo carregando!')"
    onerror="alert('ERRO: arquivo carteira.js não carregou!')">
    
  </script>

</body>
</html>
