<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101b30">
  <title>QuintosCoin — Sem conexão</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100dvh; background: #101b30; color: #fff;
           display: grid; place-items: center; padding: 24px; font: 16px/1.5 Arial,sans-serif; }
    main { max-width: 420px; background: #1b2c48; border: 1px solid #405575;
           border-radius: 18px; padding: 28px 24px; text-align: center; }
    h1 { color: #e9c46a; font-size: 24px; margin: 0 0 16px; }
    p { margin: 10px 0; color: #e0e7f1; }
    .alerta { font-size: 14px; color: #f4d68c; }
    button { background:#e9c46a;color:#101b30;border:0;border-radius:12px;
             padding:13px 24px;font:700 16px Arial,sans-serif;margin-top:16px;cursor:pointer; }
  </style>
</head>
<body>
  <main>
    <h1>QuintosCoin</h1>
    <p><strong>Sem conexão com a internet.</strong></p>
    <p>Por segurança, a carteira não carrega o código financeiro offline.</p>
    <p class="alerta">Nenhuma doação, transferência, emissão ou resgate é confirmado sem resposta do servidor.</p>
    <button type="button" onclick="location.reload()">Tentar novamente</button>
  </main>
</body>
</html>
