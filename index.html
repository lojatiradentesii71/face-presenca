<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Reconhecimento Facial</title>

<link rel="stylesheet" href="style.css">

<script defer src="https://unpkg.com/face-api.js@0.22.2/dist/face-api.min.js"></script>

<script defer src="script.js"></script>

</head>

  
<body>

<div class="container">

<h1 class="titulo">
Presença Facial
</h1>

<div class="subtitulo">
Posicione seu rosto em frente à câmera
</div>

<div class="cameraContainer">

  <video
    id="video"
    autoplay
    muted
    playsinline>
  </video>

  <div class="scanner"></div>


</div>

  <button
   id="btnCamera"
   onclick="trocarCamera()"
  >
   📱 Frontal
  </button>

<div id="resultado">
Aguardando reconhecimento...
</div>

<div id="confirmacao"></div>

<div id="processando">

  <h1>
    ⏳ PROCESSANDO
  </h1>

  <h2 id="nomeProcessando"></h2>

</div>

</div>

  <div id="painelAjustes">
  <h3>Ajustes de Reconhecimento</h3>

  <label>
    Limite membro:
    <input id="limiteMembro" type="number" step="0.01" value="0.40">
  </label>

  <label>
    Limite visitante:
    <input id="limiteVisitante" type="number" step="0.01" value="0.34">
  </label>

  <label>
    Margem membro:
    <input id="margemMembro" type="number" step="0.01" value="0.04">
  </label>

  <label>
    Margem visitante:
    <input id="margemVisitante" type="number" step="0.01" value="0.08">
  </label>

  <button onclick="aplicarAjustesReconhecimento()">
    Aplicar ajustes
  </button>
</div>

</body>

</html>
