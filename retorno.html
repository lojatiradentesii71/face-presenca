<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Resultado do pagamento</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #111827;
    }

    .card {
      width: 100%;
      max-width: 440px;
      padding: 28px 24px;
      border-radius: 22px;
      background: #ffffff;
      text-align: center;
      box-shadow:
        0 18px 45px
        rgba(0, 0, 0, 0.35);
    }

    .icone {
      width: 74px;
      height: 74px;
      margin: 0 auto 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      font-size: 38px;
    }

    .icone-falha {
      color: #b91c1c;
      background: #fee2e2;
    }

    .icone-retorno {
      color: #1d4ed8;
      background: #dbeafe;
    }

    h1 {
      margin: 0;
      font-size: 25px;
      color: #111827;
    }

    .mensagem {
      margin: 12px 0 22px;
      color: #6b7280;
      font-size: 15px;
      line-height: 1.5;
    }

    .detalhes {
      padding: 16px;
      border-radius: 14px;
      background: #f9fafb;
      text-align: left;
    }

    .linha {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      padding: 9px 0;
      border-bottom: 1px solid #e5e7eb;
      font-size: 14px;
    }

    .linha:last-child {
      border-bottom: 0;
    }

    .rotulo {
      color: #6b7280;
    }

    .valor {
      color: #111827;
      font-weight: bold;
      text-align: right;
      overflow-wrap: anywhere;
    }

    details {
      margin-top: 20px;
      text-align: left;
    }

    summary {
      cursor: pointer;
      color: #6b7280;
      font-size: 13px;
    }

    pre {
      padding: 12px;
      border-radius: 10px;
      background: #111827;
      color: #ffffff;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      font-size: 12px;
    }
  </style>
</head>

<body>

  <main class="card">

    <div
      id="icone"
      class="icone icone-retorno"
    >
      ⏳
    </div>

    <h1 id="titulo">
      Verificando pagamento
    </h1>

    <p
      id="mensagem"
      class="mensagem"
    >
      Aguarde enquanto analisamos o retorno da InfinitePay.
    </p>

    <section class="detalhes">

      <div class="linha">
        <span class="rotulo">
          Pedido
        </span>

        <span
          id="pedido"
          class="valor"
        >
          -
        </span>
      </div>

      <div class="linha">
        <span class="rotulo">
          Resultado
        </span>

        <span
          id="resultado"
          class="valor"
        >
          -
        </span>
      </div>

      <div class="linha">
        <span class="rotulo">
          Bandeira
        </span>

        <span
          id="bandeira"
          class="valor"
        >
          -
        </span>
      </div>

    </section>

    <p
     id="statusRegistro"
     class="mensagem"
    >
     Registrando o resultado no PDV...
    </p>

    <details>
      <summary>
        Mostrar dados técnicos
      </summary>

      <pre id="dados"></pre>
    </details>

  </main>

 <script>
  const APPS_SCRIPT_URL =
    "https://script.google.com/macros/s/AKfycbyfFI6t-gkycm4_A5_ayWuvGAOdjfwCJ4TvMXZboBFLHFPVwGOccrH4NXCAyc-ItlCnHw/exec";

  const parametros =
    new URLSearchParams(window.location.search);

  const failure =
    parametros.get("failure") || "";

  const orderId =
    parametros.get("order_id") || "";

  const nsu =
    parametros.get("nsu") || "";

  const aut =
    parametros.get("aut") || "";

  const cardBrand =
    parametros.get("card_brand") || "";

  const userId =
    parametros.get("user_id") || "";

  const accessId =
    parametros.get("access_id") || "";

  const handle =
    parametros.get("handle") || "";

  const merchantDocument =
    parametros.get("merchant_document") || "";

  const icone =
    document.getElementById("icone");

  const titulo =
    document.getElementById("titulo");

  const mensagem =
    document.getElementById("mensagem");

  const resultado =
    document.getElementById("resultado");

  const statusRegistro =
    document.getElementById("statusRegistro");

  document
    .getElementById("pedido")
    .textContent =
      orderId || "-";

  document
    .getElementById("bandeira")
    .textContent =
      cardBrand || "-";

  /*
   * Primeiro mostramos o resultado recebido
   * diretamente da InfinitePay.
   */
  if (failure) {
    icone.className =
      "icone icone-falha";

    icone.textContent =
      "✕";

    titulo.textContent =
      "Pagamento não realizado";

    mensagem.textContent =
      "A transação não foi aprovada. A venda não deve ser confirmada.";

    resultado.textContent =
      failure;

  } else if (nsu && aut) {
    icone.className =
      "icone icone-retorno";

    icone.textContent =
      "✓";

    titulo.textContent =
      "Pagamento aprovado";

    mensagem.textContent =
      "O pagamento foi aprovado. Estamos registrando o resultado no PDV.";

    resultado.textContent =
      "APROVADO";

  } else {
    icone.className =
      "icone icone-falha";

    icone.textContent =
      "!";

    titulo.textContent =
      "Retorno incompleto";

    mensagem.textContent =
      "A InfinitePay retornou, mas não informou todos os dados necessários.";

    resultado.textContent =
      "RETORNO_INCOMPLETO";
  }

  /*
   * Exibe todos os parâmetros recebidos
   * na área de dados técnicos.
   */
  let texto = "";

  for (const [chave, valor] of parametros) {
    texto +=
      chave +
      " = " +
      valor +
      "\n";
  }

  if (texto === "") {
    texto =
      "Nenhum parâmetro recebido.";
  }

  document
    .getElementById("dados")
    .textContent =
      texto;

/*
 * Registra automaticamente o resultado no Apps Script
 * usando um iframe invisível.
 */
function registrarNoPDV() {
  if (!orderId) {
    statusRegistro.textContent =
      "Não foi possível registrar: pedido não recebido.";

    return;
  }

  if (
    !APPS_SCRIPT_URL ||
    APPS_SCRIPT_URL.includes("COLE_AQUI")
  ) {
    statusRegistro.textContent =
      "A URL do Apps Script não foi configurada.";

    return;
  }

  const url =
    APPS_SCRIPT_URL +
    "?order_id=" +
    encodeURIComponent(orderId) +
    "&failure=" +
    encodeURIComponent(failure) +
    "&nsu=" +
    encodeURIComponent(nsu) +
    "&aut=" +
    encodeURIComponent(aut) +
    "&card_brand=" +
    encodeURIComponent(cardBrand) +
    "&user_id=" +
    encodeURIComponent(userId) +
    "&access_id=" +
    encodeURIComponent(accessId) +
    "&handle=" +
    encodeURIComponent(handle) +
    "&merchant_document=" +
    encodeURIComponent(merchantDocument) +
    "&nocache=" +
    Date.now();

  const iframe =
    document.createElement("iframe");

  iframe.id =
    "registroInfinitePay";

  iframe.style.display =
    "none";

  iframe.src =
    url;

  iframe.onload =
    function() {
      statusRegistro.textContent =
        "✓ Resultado enviado ao PDV.";

      if (!failure && nsu && aut) {
        mensagem.textContent =
          "Pagamento aprovado. Volte ao AppSheet e sincronize para confirmar a venda.";

      } else if (failure) {
        mensagem.textContent =
          "O pagamento não foi realizado. O resultado da tentativa foi registrado no PDV.";
      }

      setTimeout(function() {
        iframe.remove();
      }, 2000);
    };

  document.body.appendChild(iframe);

  setTimeout(function() {
    if (
      document.getElementById(
        "registroInfinitePay"
      )
    ) {
      statusRegistro.textContent =
        "Resultado enviado ao PDV. Confira a planilha ou sincronize o AppSheet.";
    }
  }, 8000);
}

registrarNoPDV();
</script>

</body>
</html>
