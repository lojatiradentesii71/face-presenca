<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Gerar Descritores</title>

  <script defer src="https://unpkg.com/face-api.js@0.22.2/dist/face-api.min.js"></script>

</head>
<body>

  <h2>Gerador de Descritores Faciais</h2>

  <pre id="status">Aguardando...</pre>

  <script>
    const APPS_SCRIPT_URL =
      'https://script.google.com/macros/s/AKfycbxEU0xzZz833Bqv7CxV-PdTVIjxRrl27lNgSG0upZ07rnXaAkULhGGuehxbpU2-K1oyOQ/exec';

    const statusEl =
      document.getElementById("status");

    async function gerarDescritores() {

      statusEl.innerText =
        "Carregando modelos...";

      await Promise.all([

        faceapi.nets.tinyFaceDetector.loadFromUri('./weights'),

        faceapi.nets.faceLandmark68Net.loadFromUri('./weights'),

        faceapi.nets.faceRecognitionNet.loadFromUri('./weights')

      ]);

      statusEl.innerText =
        "Buscando fotos do CadastroBio...";

      const membros =
        await fetch(APPS_SCRIPT_URL)
          .then(r => r.json());

      statusEl.innerText =
       "Fotos recebidas: " + membros.length;

      await new Promise(r => setTimeout(r, 2000));

      const descritores = [];

      let total =
        membros.length;

      let processados =
        0;

      for (const membro of membros) {

        processados++;

        statusEl.innerText =
          "Processando " +
          processados +
          " de " +
          total +
          "\n" +
          membro.nome;

        try {

          const img =
            await faceapi.fetchImage(
              membro.imagem
            );
let deteccao = null;

const tentativas = [
  { inputSize: 608, scoreThreshold: 0.1 },
  { inputSize: 416, scoreThreshold: 0.1 },
  { inputSize: 320, scoreThreshold: 0.1 }
];

for (const opt of tentativas) {

  try {

    deteccao =
      await faceapi
        .detectSingleFace(
          img,
          new faceapi.TinyFaceDetectorOptions(opt)
        )
        .withFaceLandmarks()
        .withFaceDescriptor();

    if (deteccao) {
      break;
    }

  } catch (err) {

    console.log(
      "Erro tentativa:",
      membro.nome,
      err
    );

    deteccao = null;

  }

}

          console.log("Processado:", membro.nome, deteccao);

          if (!deteccao) {

              statusEl.innerText =
               "Rosto não encontrado em:\n" +
              membro.nome +
               "\n\nProcessados: " +
              processados +
               " de " +
              total;

           await new Promise(r => setTimeout(r, 1000));

           continue;

           }

         descritores.push({
           id: String(membro.id),
           nome: String(membro.nome),
           telefone: String(membro.telefone || ""),
           tipoPessoa: String(membro.tipoPessoa || "MEMBRO"),
           descriptor: Array.from(deteccao.descriptor)
         });

        } catch (err) {

          statusEl.innerText +=
            "\nErro: " + err;

        }

      }

      statusEl.innerText =
        "Enviando " +
        descritores.length +
        " descritores para a planilha...";

      await fetch(APPS_SCRIPT_URL, {
        method: "POST",
        mode: "no-cors",
        body: JSON.stringify({
          acao: "salvarDescritores",
          descritores: descritores
        })
      });

      statusEl.innerText =
        "Concluído!\nDescritores enviados: " +
        descritores.length +
        "\nConfira a aba FaceDescriptors.";

    }

    window.addEventListener(
      "load",
      () => {

        setTimeout(
         gerarDescritores,
         1000
        );

    }
);
  </script>

</body>
</html>
